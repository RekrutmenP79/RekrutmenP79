<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Status Progres - PT Padepokan Tujuh Sembilan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between relative">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="logo.jpg" alt="Logo" class="h-8 w-auto object-contain">
                <span class="font-semibold text-gray-900 tracking-tight text-sm sm:text-base">Recruitment Portal</span>
            </div>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="text-gray-600 hover:text-indigo-600 transition">Beranda</a>
                <a href="https://tally.so/r/EkO9LB" target="_blank" class="text-gray-600 hover:text-indigo-600 transition">Reference Check Form</a>
                <a href="status.html" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">Cek Status Progres</a>
            </nav>
            <div class="text-xs sm:text-sm text-gray-500 font-medium">
                rekruitmen79@gmail.com
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-xl w-full bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
            
            <div class="text-center mb-6">
                <div class="flex items-center justify-center mb-4">
                    <img src="logo.jpg" alt="Logo PT Padepokan Tujuh Sembilan" class="h-14 w-auto object-contain">
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Cek Status Progres Reference Check</h1>
                <p class="text-sm text-gray-500 mt-1">Masukkan email yang Anda daftarkan untuk melihat status verifikasi terkini.</p>
            </div>

            <!-- Form Pencarian Status -->
            <form id="searchForm" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Email Kandidat</label>
                    <input type="email" id="email" required placeholder="nama@gmail.com" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>

                <button type="submit" id="submitBtn" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition duration-200 shadow-sm text-sm">
                    Cek Status Sekarang
                </button>
            </form>

            <!-- Notifikasi Hasil Pencarian -->
            <div id="resultContainer" class="mt-6 hidden">
                <div id="statusCard" class="p-4 rounded-xl border"></div>
            </div>

            <div class="text-center mt-6">
                <a href="index.html" class="text-xs text-gray-400 hover:text-gray-600 transition">&larr; Kembali ke Beranda Utama</a>
            </div>

        </div>
    </main>

    <!-- WhatsApp Button -->
    <a href="https://wa.me/6282123758753?text=Halo%20Tim%20HR%20PT%20Padepokan%20Tujuh%20Sembilan,%20saya%20ingin%20menanyakan%20terkait%20proses%20rekrutmen." 
       target="_blank" title="Hubungi HR"
       class="fixed bottom-6 right-6 z-50 flex items-center justify-center w-14 h-14 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full shadow-lg transition-all">
        <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.124-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
    </a>

    <footer class="py-4 text-center text-xs text-gray-400 border-t border-gray-100">
        &copy; 2026 PT Padepokan Tujuh Sembilan. All rights reserved.
    </footer>

    <!-- Skrip Integrasi ke URL Web App Google Apps Script Terbaru -->
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzPVhnsz98oPFJoswBRgoQEpFMHKFzsCy5n2Hr5TOg3fSYUyz8jeJt5RQxkm6x23nRdAQ/exec';

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const btn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const statusCard = document.getElementById('statusCard');

            if (!emailInput) return;

            btn.innerText = "Mencari data...";
            btn.disabled = true;
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch(`${SCRIPT_URL}?email=${encodeURIComponent(emailInput)}`);
                const data = await response.json();
                resultContainer.classList.remove('hidden');

                if (data.status === "success") {
                    const bgcStatus = data.bgc_status || "";
                    const isCompleted = bgcStatus.toLowerCase().includes("completed");

                    statusCard.className = "p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900";
                    statusCard.innerHTML = `
                        <div class="flex items-center space-x-2 mb-2">
                            <span class="inline-block bg-emerald-200 text-emerald-800 text-xs px-2.5 py-1 rounded-md font-bold uppercase">✔ Ditemukan</span>
                            <span class="text-xs text-emerald-700 font-medium">${data.email}</span>
                        </div>
                        <h2 class="font-bold text-base text-emerald-950 mb-1">Halo, ${data.nama || 'Kandidat'}</h2>
                        <p class="text-sm">Status Reference Check Anda saat ini: <strong class="underline">${bgcStatus}</strong></p>
                        
                        ${isCompleted ? `
                            <div class="mt-4 pt-4 border-t border-emerald-200/80">
                                <p class="text-xs sm:text-sm text-emerald-800 font-medium mb-3">Selamat! Verifikasi Anda telah selesai. Silakan lanjutkan ke tahap Pendaftaran Akun Portal.</p>
                                <a href="login.html" class="inline-block w-full text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl transition text-xs sm:text-sm shadow-sm">
                                    Lanjut ke Pendaftaran Akun &rarr;
                                </a>
                            </div>
                        ` : `
                            <div class="mt-3 pt-3 border-t border-emerald-200/60 text-xs sm:text-sm text-emerald-800 font-medium">
                                Progres Anda sedang ditinjau oleh tim HR kami. Silakan cek secara berkala.
                            </div>
                        `}
                    `;
                } else {
                    statusCard.className = "p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-900";
                    statusCard.innerHTML = `
                        <span class="inline-block bg-rose-200 text-rose-800 text-xs px-2.5 py-1 rounded-md font-bold uppercase mb-2">✖ Tidak Ditemukan</span>
                        <p class="text-sm">Email <b>${emailInput}</b> tidak ditemukan dalam database rekrutmen. Pastikan email yang dimasukkan sudah sesuai dengan saat pengisian form.</p>
                    `;
                }
            } catch (error) {
                resultContainer.classList.remove('hidden');
                statusCard.className = "p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-900";
                statusCard.innerHTML = `<p class="text-sm">Terjadi kendala koneksi ke server database. Silakan coba beberapa saat lagi.</p>`;
            } finally {
                btn.innerText = "Cek Status Sekarang";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
